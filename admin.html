<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>এডমিন কন্ট্রোল প্যানেল - বউ ছাড়া কততম শুক্রবার</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #FF6A1A;
    --bg: #12100E;
    --card: #1D1814;
    --text: #F7EBE0;
    --muted: #A6907C;
    --border: rgba(255,106,26,0.2);
    --danger: #FF4757;
    --success: #2ED573;
  }
  
  * { box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: 0; min-height: 100vh; }
  h1, h2, h3 { font-family: 'Baloo Da 2', sans-serif; margin: 0; }
  
  #adminAuthGate {
    position: fixed; inset: 0; background: var(--bg); z-index: 999;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .auth-box {
    background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 20px;
    width: 100%; max-width: 380px; text-align: center;
  }
  .auth-input {
    width: 100%; padding: 12px; margin: 12px 0; border-radius: 10px; border: 1px solid var(--border);
    background: #12100E; color: #fff; font-size: 15px;
  }
  
  .navbar {
    background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px;
    display: flex; justify-content: space-between; align-items: center; sticky; top: 0; z-index: 100;
  }
  .logo-title { color: var(--primary); font-size: 20px; font-weight: 700; }
  .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; flex-wrap: wrap; }
  .tab-btn {
    background: transparent; border: 1.5px solid var(--border); color: var(--text); padding: 8px 18px;
    border-radius: 99px; cursor: pointer; font-weight: 600; font-size: 14px;
  }
  .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .data-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .form-control {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
    background: #12100E; color: #fff; font-size: 14.5px;
  }

  .btn {
    border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
</style>
</head>
<body>

<div id="adminAuthGate">
  <div class="auth-box">
    <h2>এডমিন প্রবেশ</h2>
    <input type="password" id="adminPassInput" class="auth-input" placeholder="পাসকোড দিন" style="text-align:center;">
    <button class="btn btn-primary" style="width:100%; padding:12px;" onclick="verifyAdminPass()">প্রবেশ করুন</button>
  </div>
</div>

<div class="navbar">
  <div class="logo-title">বউ ছাড়া কততম শুক্রবার — এডমিন কন্ট্রোল</div>
  <button class="btn btn-danger" onclick="logoutAdmin()">লগআউট</button>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('dev', event)">📱 ডেভেলপার ও সোশ্যাল মিডিয়া</button>
    <button class="tab-btn" onclick="switchTab('quotes', event)">উক্তি ম্যানেজার</button>
    <button class="tab-btn" onclick="switchTab('ai', event)">🤖 AI এজেন্ট সেটআপ</button>
  </div>

  <!-- ১. ডেভেলপার ও সোশ্যাল সেটিংস -->
  <div class="tab-content active" id="tab-dev">
    <div class="data-card">
      <h3>ডেভেলপার ইনফরমেশন ও সোশ্যাল অ্যাকাউন্ট</h3>
      <p style="color:var(--muted); font-size:14px;">এখান থেকে সেট করা নাম ও লিংকগুলো ইউজার প্যানেলে সরাসরি শো করবে।</p>
      
      <div class="form-group">
        <label>ডেভেলপার নাম</label>
        <input type="text" id="devNameInput" class="form-control" value="MD FIROZ HOSSAIN">
      </div>
      <div class="form-group">
        <label>টেলিগ্রাম অ্যাকাউন্ট / চ্যানেল লিংক (Telegram)</label>
        <input type="url" id="devTelegramInput" class="form-control" placeholder="https://t.me/yourusername">
      </div>
      <div class="form-group">
        <label>ফেসবুক প্রোফাইল / পেজ লিংক (Facebook)</label>
        <input type="url" id="devFbInput" class="form-control" placeholder="https://facebook.com/yourprofile">
      </div>
      <div class="form-group">
        <label>হোয়াটসঅ্যাপ নম্বর / গ্রুপ লিংক (WhatsApp)</label>
        <input type="url" id="devWaInput" class="form-control" placeholder="https://wa.me/8801700000000">
      </div>
      <button class="btn btn-primary" style="width:100%; padding:14px;" onclick="saveDevSettings()">সেটিংস সেভ করুন</button>
    </div>
  </div>

  <!-- ২. উক্তি ম্যানেজার -->
  <div class="tab-content" id="tab-quotes">
    <div class="data-card">
      <h3>নতুন মজার উক্তি যোগ করুন</h3>
      <div style="display:flex; gap:10px; margin:15px 0;">
        <input type="text" id="newQuoteInput" placeholder="এখানে উক্তি লিখুন..." class="form-control">
        <button class="btn btn-primary" onclick="addQuote()">যোগ করুন</button>
      </div>
      <div id="quoteAdminList" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>

  <!-- ৩. AI এজেন্ট সেটআপ -->
  <div class="tab-content" id="tab-ai">
    <div class="data-card">
      <h3>🤖 AI এজেন্ট সেটআপ (Ollama / Groq / OpenRouter)</h3>
      <div class="form-group">
        <label>API Endpoint URL</label>
        <input type="text" id="aiEndpointInput" class="form-control" placeholder="http://localhost:11434/api/generate">
      </div>
      <div class="form-group">
        <label>API Key (যদি থাকে)</label>
        <input type="password" id="aiApiKeyInput" class="form-control" placeholder="gsk_...">
      </div>
      <div class="form-group">
        <label>মডেল নেম (Model Name)</label>
        <input type="text" id="aiModelInput" class="form-control" placeholder="llama3">
      </div>
      <button class="btn btn-primary" style="width:100%; padding:14px;" onclick="saveAiSettings()">AI সেটিংস সংরক্ষণ করুন</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
  const DEFAULT_ADMIN_PASS = "admin123";

  function verifyAdminPass() {
    if (document.getElementById("adminPassInput").value === DEFAULT_ADMIN_PASS) {
      sessionStorage.setItem("admin_logged", "true");
      document.getElementById("adminAuthGate").style.display = "none";
      loadAdminData();
    } else { alert("ভুল পাসওয়ার্ড!"); }
  }

  if (sessionStorage.getItem("admin_logged") === "true") {
    document.getElementById("adminAuthGate").style.display = "none";
    window.addEventListener("DOMContentLoaded", loadAdminData);
  }

  function logoutAdmin() { sessionStorage.removeItem("admin_logged"); location.reload(); }

  function switchTab(tabId, event) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    if(event) event.target.classList.add("active");
    document.getElementById("tab-" + tabId).classList.add("active");
  }

  const db = firebase.database();

  function loadAdminData() {
    // Dev Links
    db.ref("settings/developer").on("value", snap => {
      const d = snap.val() || {};
      document.getElementById("devNameInput").value = d.name || "MD FIROZ HOSSAIN";
      document.getElementById("devTelegramInput").value = d.telegram || "";
      document.getElementById("devFbInput").value = d.facebook || "";
      document.getElementById("devWaInput").value = d.whatsapp || "";
    });

    // Quotes
    db.ref("quotes").on("value", snap => {
      const quotes = snap.val() || {};
      const container = document.getElementById("quoteAdminList");
      container.innerHTML = "";
      Object.keys(quotes).forEach(id => {
        const div = document.createElement("div");
        div.style.cssText = "background:rgba(255,255,255,0.05); padding:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;";
        div.innerHTML = `<span>${quotes[id].text}</span> <button class="btn btn-danger" onclick="deleteQuote('${id}')">মুছুন</button>`;
        container.appendChild(div);
      });
    });
  }

  function saveDevSettings() {
    db.ref("settings/developer").set({
      name: document.getElementById("devNameInput").value.trim(),
      telegram: document.getElementById("devTelegramInput").value.trim(),
      facebook: document.getElementById("devFbInput").value.trim(),
      whatsapp: document.getElementById("devWaInput").value.trim()
    }).then(() => alert("ডেভেলপার ইনফো সফলভাবে সংরক্ষিত হয়েছে!"));
  }

  function addQuote() {
    const text = document.getElementById("newQuoteInput").value.trim();
    if(text) db.ref("quotes").push({ text, createdAt: Date.now() });
    document.getElementById("newQuoteInput").value = "";
  }

  function deleteQuote(id) { db.ref(`quotes/${id}`).remove(); }

  function saveAiSettings() {
    db.ref("settings/ai").set({
      endpoint: document.getElementById("aiEndpointInput").value.trim(),
      apiKey: document.getElementById("aiApiKeyInput").value.trim(),
      model: document.getElementById("aiModelInput").value.trim()
    }).then(() => alert("AI সেটিংস সংরক্ষিত হয়েছে!"));
  }
</script>
</body>
</html>
